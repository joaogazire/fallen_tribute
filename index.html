<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel "FalleN" Toledo</title>
    <meta name="description" content="Contagem regressiva e highlights em homenagem a Gabriel &quot;FalleN&quot; Toledo, o Verdadeiro, lenda do Counter-Strike.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#0f0f13">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Gabriel &quot;FalleN&quot; Toledo">
    <meta property="og:description" content="Contagem regressiva e highlights em homenagem a Gabriel &quot;FalleN&quot; Toledo, o Verdadeiro.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Gabriel &quot;FalleN&quot; Toledo">
    <meta name="twitter:description" content="Contagem regressiva e highlights em homenagem a Gabriel &quot;FalleN&quot; Toledo, o Verdadeiro.">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-white h-screen overflow-hidden select-none">

    <div id="app">
        <!-- Vídeo de fundo: cobre a tela inteira (cover) e não captura cliques -->
        <div aria-hidden="true" class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 scale-[1.15] w-[max(100vw,177.78vh)] h-[max(100vh,56.25vw)]">
                <div id="videoPlayer" class="w-full h-full"></div>
            </div>
        </div>
        <!-- Degradês para dar leitura ao texto sem apagar o vídeo -->
        <div aria-hidden="true" class="fixed inset-0 pointer-events-none bg-black/25 bg-[linear-gradient(to_bottom,rgba(0,0,0,0.55),transparent_28%,transparent_65%,rgba(0,0,0,0.65))]"></div>

        <header class="fixed top-0 inset-x-0 z-20 flex items-start justify-between gap-3 px-4 sm:px-8 pt-4 sm:pt-6 pointer-events-none accent drop-shadow-[0_2px_10px_rgba(0,0,0,0.6)]">
            <h1 class="text-[clamp(2rem,7vw,6rem)] font-extrabold uppercase leading-[0.85] tracking-tight">
                FallEN<span class="sr-only"> Toledo</span>
            </h1>
            <div role="timer" aria-label="Contagem regressiva até 20 de dezembro de 2026" class="flex items-start gap-1 sm:gap-2 tabular-nums text-center">
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="days">00</span>
                <span class="block text-[0.5rem] sm:text-[0.7rem] uppercase tracking-[0.2em] mt-1 opacity-80">Dias</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="hours">00</span>
                <span class="block text-[0.5rem] sm:text-[0.7rem] uppercase tracking-[0.2em] mt-1 opacity-80">Horas</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="minutes">00</span>
                <span class="block text-[0.5rem] sm:text-[0.7rem] uppercase tracking-[0.2em] mt-1 opacity-80">Min</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="seconds">00</span>
                <span class="block text-[0.5rem] sm:text-[0.7rem] uppercase tracking-[0.2em] mt-1 opacity-80">Seg</span>
            </div>
            </div>
        </header>
        <p id="countdown-message" role="status" hidden class="fixed top-1/2 left-0 right-0 -translate-y-1/2 text-center accent text-3xl md:text-6xl font-extrabold uppercase tracking-widest drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">
            Hoje é o dia!
        </p>

        <div class="fixed bottom-0 inset-x-0 z-20 grid grid-cols-2 sm:grid-cols-3 items-end gap-x-4 gap-y-2 px-4 sm:px-8 pb-4 sm:pb-6 accent drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
            <div class="col-span-2 sm:col-span-1 min-w-0 pointer-events-none">
                <p id="match" class="text-sm sm:text-base md:text-lg leading-tight" aria-live="polite"></p>
                <p class="text-[0.6rem] md:text-xs uppercase tracking-[0.2em] mt-1 opacity-70">Clique para o próximo clipe</p>
            </div>
            <div class="flex items-center gap-2 sm:justify-self-center">
                <button id="playPauseBtn" type="button" aria-label="Pausar vídeo" class="bg-black/50 hover:bg-white/20 p-2 rounded-lg backdrop-blur-md">
                    <svg data-icon="pause" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                    <svg data-icon="play" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
                </button>
                <button id="muteBtn" type="button" aria-label="Ativar som" aria-pressed="false" class="bg-black/50 hover:bg-white/20 p-2 rounded-lg backdrop-blur-md">
                    <svg data-icon="muted" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>
                    <svg data-icon="sound" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>
                </button>
            </div>
            <button id="infoBtn" type="button" aria-haspopup="dialog" aria-controls="info-panel" aria-expanded="false" class="justify-self-end text-base sm:text-lg md:text-xl font-medium underline-offset-4 hover:underline">
                Info
            </button>
        </div>

        <!-- Cortina que varre a tela na troca de clipe -->
        <div id="wipe" aria-hidden="true" class="fixed inset-0 z-30 pointer-events-none" style="transform:translateX(-101%)"></div>
    </div>

    <!-- Painel de informações -->
    <section id="info-panel" class="info-panel fixed inset-0 z-40 bg-black accent overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="info-title" inert>
        <div class="min-h-full flex flex-col items-center justify-center text-center gap-10 px-6 py-24">
            <div>
                <h2 id="info-title" class="script text-5xl sm:text-7xl md:text-8xl">O Verdadeiro</h2>
                <p class="mt-6 text-lg sm:text-2xl md:text-3xl font-medium text-white/90">Gabriel "FalleN" Toledo<br>Verdadeiro | Professor</p>
            </div>
            <div>
                <h3 class="script text-3xl sm:text-5xl">Links</h3>
                <p class="mt-4 text-lg sm:text-2xl leading-relaxed">
                    <a class="underline underline-offset-4" href="https://www.youtube.com/@fallenINSIDER" target="_blank" rel="noopener noreferrer">YouTube</a><br>
                    <a class="underline underline-offset-4" href="https://www.hltv.org/player/2023/fallen" target="_blank" rel="noopener noreferrer">HLTV</a>
                </p>
            </div>
            <div>
                <h3 class="script text-3xl sm:text-5xl">Créditos</h3>
                <p class="mt-4 text-lg sm:text-2xl">made by <a class="underline underline-offset-4" href="https://github.com/joaogazire" target="_blank" rel="noopener noreferrer">@joaogazire</a></p>
            </div>
        </div>
        <button id="infoCloseBtn" type="button" class="fixed bottom-4 right-4 sm:bottom-6 sm:right-8 text-base sm:text-lg md:text-xl font-medium underline-offset-4 hover:underline">Voltar</button>
    </section>

    <!-- Mira de AWP que substitui o cursor -->
    <div id="scope" aria-hidden="true" class="scope hidden">
        <svg viewBox="0 0 160 160" width="160" height="160" fill="none" stroke="#fff" stroke-linecap="butt">
            <circle cx="80" cy="80" r="52" stroke-width="2.5"/>
            <circle cx="80" cy="80" r="46" stroke-width="0.75" opacity="0.5"/>
            <path d="M80 28v44M80 88v44M28 80h44M88 80h44" stroke-width="1"/>
            <path d="M80 0v26M80 134v26M0 80h26M134 80h26" stroke-width="4"/>
            <path d="M80 100v0M80 112v0M100 80v0M112 80v0M60 80v0M48 80v0" stroke-width="3" stroke-linecap="round"/>
            <circle cx="80" cy="80" r="1.8" fill="#ff2a2a" stroke="none"/>
        </svg>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
