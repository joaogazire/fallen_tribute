<!DOCTYPE html>
<html lang="pt-BR" class="intro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel "FalleN" Toledo</title>

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#0f0f13">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Gabriel &quot;FalleN&quot; Toledo">
    <meta property="og:description" content="Contagem regressiva e highlights em homenagem a Gabriel &quot;FalleN&quot; Toledo, o Verdadeiro.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Gabriel &quot;FalleN&quot; Toledo">
    <meta name="twitter:description" content="Contagem regressiva e highlights em homenagem a Gabriel &quot;FalleN&quot; Toledo, o Verdadeiro.">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

</head>
<body class="bg-black text-white h-screen overflow-hidden select-none">

    <div id="app">
        <!-- Vídeo de fundo: cobre a tela inteira (cover) e não captura cliques -->
        <div aria-hidden="true" class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 scale-[1.15] w-[max(100vw,177.78vh)] h-[max(100vh,56.25vw)]">
                <div id="videoPlayer" class="w-full h-full"></div>
            </div>
        </div>
        <!-- Degradês para dar leitura ao texto sem apagar o vídeo -->
        <div aria-hidden="true" class="fixed inset-0 pointer-events-none bg-black/25 bg-[linear-gradient(to_bottom,rgba(0,0,0,0.55),transparent_28%,transparent_65%,rgba(0,0,0,0.65))]"></div>

        <header class="fixed top-0 inset-x-0 z-20 flex items-start justify-between gap-3 px-4 sm:px-8 pt-4 sm:pt-6 pointer-events-none accent drop-shadow-[0_2px_10px_rgba(0,0,0,0.6)]">
            <h1 id="title" class="text-[clamp(2rem,7vw,6rem)] font-extrabold uppercase leading-[0.85] tracking-tight">
                FallEN<span class="sr-only"> Toledo</span>
            </h1>
            <div id="timer" role="timer" aria-label="Contagem regressiva até 20 de dezembro de 2026" class="flex items-start gap-1 sm:gap-2 tabular-nums text-center">
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="days">00</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="hours">00</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="minutes">00</span>
            </div>
            <span aria-hidden="true" class="text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none opacity-60">:</span>
            <div>
                <span class="block text-[clamp(1.5rem,5vw,4.5rem)] font-extrabold leading-none" id="seconds">00</span>
            </div>
            </div>
        </header>
        <p id="countdown-message" role="status" hidden class="fixed z-20 top-1/2 left-0 right-0 -translate-y-1/2 text-center accent text-3xl md:text-6xl font-extrabold uppercase tracking-widest drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">
            Hoje é o dia!
        </p>

        <div class="fixed bottom-0 inset-x-0 z-20 flex items-end justify-between gap-4 px-4 sm:px-8 pb-4 sm:pb-6 accent drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
            <!-- Esquerda: título do clipe em cima, controles embaixo -->
            <div class="flex flex-col items-start gap-2 min-w-0">
            <div class="clip-title min-w-0">
                <p id="match" class="text-xs sm:text-sm leading-tight" aria-live="polite"></p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Troca a mira entre as versões do CS -->
                <button id="scopeBtn" type="button" aria-label="Mira: CS 1.6. Trocar" title="Trocar mira" class="flex items-center gap-1.5 bg-black/50 hover:bg-white/20 p-2 rounded-lg backdrop-blur-md">
                    <svg class="w-9 h-5" viewBox="0 0 48 16" fill="currentColor" aria-hidden="true">
                        <path d="M1 7L12 8V11L3 13L1 12Z"/>
                        <path d="M12 7H26V10.5H12Z"/>
                        <path d="M15 10.5H18L17 14.5H14Z"/>
                        <path d="M14 3.5H25V6H14Z"/>
                        <path d="M13 3H15V6.5H13ZM24 3H26.5V6.5H24Z"/>
                        <path d="M26 7.6H47V9H26Z"/>
                        <path d="M44.5 7H47.5V9.6H44.5Z"/>
                    </svg>
                    <span id="scopeLabel" class="text-xs font-bold tabular-nums leading-none">1.6</span>
                </button>
                <button id="playPauseBtn" type="button" aria-label="Pausar vídeo" class="bg-black/50 hover:bg-white/20 p-2 rounded-lg backdrop-blur-md">
                    <svg data-icon="pause" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                    <svg data-icon="play" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
                </button>
                <!-- Som: o controle de volume abre ao passar o mouse (ou focar pelo teclado) -->
                <div class="volume flex items-center bg-black/50 rounded-lg backdrop-blur-md">
                    <button id="muteBtn" type="button" aria-label="Ativar som" aria-pressed="false" class="hover:bg-white/20 p-2 rounded-lg">
                        <svg data-icon="muted" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>
                        <svg data-icon="sound" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>
                    </button>
                    <input id="volumeSlider" type="range" min="0" max="100" step="1" value="0" aria-label="Volume" class="volume-slider">
                </div>
            </div>
            </div>
            <button id="infoBtn" type="button" aria-haspopup="dialog" aria-controls="info-panel" aria-expanded="false" aria-label="Informações" title="Informações" class="info-btn shrink-0">
                <span class="script" aria-hidden="true">i</span>
            </button>
        </div>

        <!-- Cortina que varre a tela na troca de clipe -->
        <div id="wipe" aria-hidden="true" class="fixed inset-0 z-30 pointer-events-none" style="transform:translateX(-101%)"></div>
        <!-- Abertura: FALLEN TOLEDO no centro; depois de 2s um nome vai para cada lado (js/intro.js) -->
        <div id="intro" aria-hidden="true" class="fixed inset-0 z-[35] pointer-events-none">
            <div data-intro-bg class="absolute inset-0 bg-black"></div>
            <div class="absolute inset-0 flex items-center justify-center gap-[0.3em] accent text-[clamp(2rem,7vw,6rem)] font-extrabold uppercase leading-[0.85] tracking-tight drop-shadow-[0_2px_10px_rgba(0,0,0,0.6)]">
                <span data-intro-left>FallEN</span><span data-intro-right>Toledo</span>
            </div>
        </div>
    </div>

                    </a>
                </div>
            </div>
            <div>
                <h3 class="script text-3xl sm:text-5xl">Créditos</h3>
                <a class="ak-credit mt-4 inline-block" href="https://github.com/joaogazire" target="_blank" rel="noopener noreferrer" aria-label="Feito por @joaogazire (GitHub)" title="@joaogazire no GitHub">
                    <!-- Silhueta de AK-47 -->
                    <svg class="w-48 sm:w-64 h-auto" viewBox="0 0 240 72" fill="currentColor" aria-hidden="true">
                        <path d="M4 20L62 24V36L10 48L4 46Z"/>
                        <path d="M62 20H132V36H62Z"/>

            </div>
        </div>
        <!-- Voltar: centralizado embaixo, com área de clique bem maior que o texto -->
        <button id="infoCloseBtn" type="button" class="close-btn">
            <span>Voltar</span>
        </button>
    </section>

    <!-- Mira de AWP que substitui o cursor; a aparência muda conforme o jogo escolhido (js/scope.js) -->
    <div id="scope" aria-hidden="true" class="scope hidden" data-skin="cs16">
        <div class="scope-rim"></div>
        <div class="scope-lens"></div>
        <!-- Mil-dots das lunetas do 1.5 e 1.6: espaçamento crescendo para fora, medido de capturas do jogo -->
        <svg class="scope-dots" viewBox="-100 -100 200 200" fill="#000" aria-hidden="true"><circle cx="10.8" cy="0" r="1.6"/><circle cx="-10.8" cy="0" r="1.6"/><circle cx="0" cy="10.8" r="1.6"/><circle cx="0" cy="-10.8" r="1.6"/><circle cx="17.6" cy="0" r="1.6"/><circle cx="-17.6" cy="0" r="1.6"/><circle cx="0" cy="17.6" r="1.6"/><circle cx="0" cy="-17.6" r="1.6"/><circle cx="25.3" cy="0" r="1.6"/><circle cx="-25.3" cy="0" r="1.6"/><circle cx="0" cy="25.3" r="1.6"/><circle cx="0" cy="-25.3" r="1.6"/><circle cx="34" cy="0" r="1.6"/><circle cx="-34" cy="0" r="1.6"/><circle cx="0" cy="34" r="1.6"/><circle cx="0" cy="-34" r="1.6"/><circle cx="43.4" cy="0" r="1.6"/><circle cx="-43.4" cy="0" r="1.6"/><circle cx="0" cy="43.4" r="1.6"/><circle cx="0" cy="-43.4" r="1.6"/><circle cx="54.2" cy="0" r="1.6"/><circle cx="-54.2" cy="0" r="1.6"/><circle cx="0" cy="54.2" r="1.6"/><circle cx="0" cy="-54.2" r="1.6"/></svg>
