<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel "FalleN" Toledo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="tailwind.config.js"></script>
</head>
<body class="bg-csdark text-white h-screen overflow-hidden flex flex-col font-sans bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-800 via-csdark to-black">

    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-5xl mx-auto px-4 py-12 pb-[10vh]">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-extrabold uppercase tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-csblue to-blue-500 mb-2 drop-shadow-lg">
                Gabriel "FalleN" Toledo
            </h1>
            <p class="text-gray-400 text-lg md:text-xl tracking-wider">
                Verdadeiro | Professor
            </p>
        </div>

        <div class="flex flex-wrap justify-center gap-4 md:gap-6 mb-12">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 md:p-6 w-24 md:w-32 flex flex-col items-center justify-center backdrop-blur-md shadow-2xl transition hover:border-csblue/50">
                <span class="text-3xl md:text-5xl font-bold text-csblue" id="days">00</span>
                <span class="block text-xs md:text-sm uppercase text-gray-500 mt-2 font-semibold">Dias</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 md:p-6 w-24 md:w-32 text-center backdrop-blur-md shadow-2xl transition hover:border-csblue/50">
                <span class="block text-3xl md:text-5xl font-bold text-csblue" id="hours">00</span>
                <span class="block text-xs md:text-sm uppercase text-gray-500 mt-2 font-semibold">Horas</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 md:p-6 w-24 md:w-32 text-center backdrop-blur-md shadow-2xl transition hover:border-csblue/50">
                <span class="block text-3xl md:text-5xl font-bold text-csblue" id="minutes">00</span>
                <span class="block text-xs md:text-sm uppercase text-gray-500 mt-2 font-semibold">Minutos</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 md:p-6 w-24 md:w-32 text-center backdrop-blur-md shadow-2xl transition hover:border-csblue/50">
                <span class="block text-3xl md:text-5xl font-bold text-csblue" id="seconds">00</span>
                <span class="block text-xs md:text-sm uppercase text-gray-500 mt-2 font-semibold">Segundos</span>
            </div>
        </div>

        <div class="w-full max-w-4xl relative pb-[50.25%] rounded-2xl overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.6)] border border-white/10 ring-1 ring-white/5">
            <div id="videoPlayer" class="absolute top-0 left-0 w-full h-full"></div>
            <button id="nextVideoBtn" onclick="playNextVideo()" class="absolute right-3 bottom-3 bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg flex items-center gap-2 text-sm backdrop-blur-md">
                <i class="fa-solid fa-forward"></i>
                Próximo
            </button>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full h-[05vh] border-t border-gray-800 bg-gray-950/90 backdrop-blur-md relative z-50">
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-6">
            <a href="https://www.youtube.com/@fallenINSIDER" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-[#FF0000] transition-colors text-3xl md:text-4xl transform hover:scale-110 duration-200">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://www.hltv.org/player/2023/fallen" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-[#2a629c] transition-colors text-base md:text-lg font-bold transform hover:scale-110 duration-200">
                HLTV
            </a>
        </div>
        <div class="absolute right-6 top-1/2 -translate-y-1/2 text-right">
            <div class="text-gray-500 text-xs md:text-sm font-mono tracking-tight">
                made by <a href="https://github.com/joaogazire" target="_blank" class="text-csblue hover:underline">@joaogazire</a>
            </div>
        </div>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
